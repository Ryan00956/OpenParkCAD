name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test with branch coverage
        run: python -m pytest --cov=openparkcad --cov-report=term-missing

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          openparkcad solve "$GITHUB_WORKSPACE/examples/phase0_site.json" \
            --out layout.dxf \
            --preview layout.svg \
            --report report.json
          test -s layout.dxf
          test -s layout.svg
          test -s report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("report.json").read_text(encoding="utf-8"))
          assert report["operational_quality"]["version"] == "phase5q-1"
          assert report["traffic_graph"]["validation"]["valid"] is True
          PY
