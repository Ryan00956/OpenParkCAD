[project]
name = "openparkcad"
version = "0.1.0"
description = "Minimal Python parking layout generator for irregular lots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ezdxf>=1.3",
  "shapely>=2.0",
]

[project.optional-dependencies]
optimizer = [
  "ortools>=9.10",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "wheel>=0.44",
]

[project.scripts]
openparkcad = "openparkcad.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openparkcad*"]
exclude = ["examples*", "output*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
data_file = ".pytest_cache/.coverage"
source = ["openparkcad"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
